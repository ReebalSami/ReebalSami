name: GitHub Numbers

on:
  schedule:
    - cron: "29 */6 * * *" # every 6h at HH:29 UTC (00:29, 06:29, 12:29, 18:29)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-numbers.yml
      - scripts/generate-github-numbers.mjs
      - scripts/lib/palette.mjs
      - package.json

permissions:
  contents: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Generate GitHub-numbers SVGs (3 cards × light + dark)
        env:
          # METRICS_TOKEN is a PAT with read:user scope. Required so
          # contributionsCollection includes private contribution counts
          # (matches today's count_private=true semantics).
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-github-numbers.mjs

      - name: Commit if changed
        # Rebase-retry on push: if another scheduled or push-triggered
        # workflow (e.g. milestones, metrics) raced us to main, the
        # initial `git push` returns "rejected (fetch first)". We
        # rebase our single commit onto the new HEAD and push again.
        # Three attempts cover the realistic max contention (3 parallel
        # workflows on the same path event); beyond that we'd rather
        # the job fail loudly than spin indefinitely.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain assets/numbers-*.svg)" ]]; then
            echo "No GitHub-numbers changes — skipping commit."
            exit 0
          fi
          git add assets/numbers-*.svg
          git commit -m "chore(numbers): refresh SVGs"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing on origin/main and retrying."
            git pull --rebase origin main
            sleep 2
          done
          echo "::error::Push still failing after 3 rebase-retries."
          exit 1
