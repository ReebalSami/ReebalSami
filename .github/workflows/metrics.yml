name: Metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ----- LIGHT VARIANT -----------------------------------------------
      - name: Render light infographic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-light.svg
          template: classic
          base: header, repositories
          config_timezone: Europe/Berlin
          config_padding: 0, 8
          config_animations: yes
          config_octicon: yes
          # plugin: isometric calendar contribution graph
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # plugin: language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: >-
            hh-java-01-Lists-Task, hh-java-01-Static, hh-java-01-records,
            hh-java-01-recap09, hh-java-01-date, hh-java-01-lombok,
            hh-java-01-rest-client-task, hh-java-01-react-task,
            hh-java-01-type-script-type, hh-java-1-interfce-task,
            hh-java-1-Static, hh-java-24-1-Objecte-Aufgabe,
            hh-java-24-1-git-reebal, hh-java-24-1-testing-aufgabe,
            hh-java-24-spring-todo-recap, hh-java-react-registration,
            BankService, passwordvalidation, demohh-java-spring-data-task,
            chatgpt-based-cooking-ingredients, Getting_an_Inventory_App,
            testing_githab
          # Brand palette injection (warm cream / charcoal / golden accent)
          extras_css: |
            :root, svg, .header, .body { background: #FAF9F4 !important; color: #22222A !important; }
            text, tspan { fill: #22222A !important; }
            .field text, .field tspan { fill: #22222A !important; }
            text.muted, .muted { fill: #7C7C82 !important; }
            .highlight, .highlight *, h2, .field b { fill: #B6803F !important; color: #B6803F !important; }
            rect[fill="#28a745"], rect[fill="#196c2e"] { fill: #B6803F !important; }
            .languages .progress rect:not(:first-child) { fill: #B6803F !important; }
            line, path[stroke="#cfd3d7"] { stroke: rgba(34, 34, 42, 0.12) !important; }

      # ----- DARK VARIANT ------------------------------------------------
      - name: Render dark infographic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-dark.svg
          template: classic
          base: header, repositories
          config_timezone: Europe/Berlin
          config_padding: 0, 8
          config_animations: yes
          config_octicon: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: >-
            hh-java-01-Lists-Task, hh-java-01-Static, hh-java-01-records,
            hh-java-01-recap09, hh-java-01-date, hh-java-01-lombok,
            hh-java-01-rest-client-task, hh-java-01-react-task,
            hh-java-01-type-script-type, hh-java-1-interfce-task,
            hh-java-1-Static, hh-java-24-1-Objecte-Aufgabe,
            hh-java-24-1-git-reebal, hh-java-24-1-testing-aufgabe,
            hh-java-24-spring-todo-recap, hh-java-react-registration,
            BankService, passwordvalidation, demohh-java-spring-data-task,
            chatgpt-based-cooking-ingredients, Getting_an_Inventory_App,
            testing_githab
          extras_css: |
            :root, svg, .header, .body { background: #1B1B20 !important; color: #F5F4EE !important; }
            text, tspan { fill: #F5F4EE !important; }
            .field text, .field tspan { fill: #F5F4EE !important; }
            text.muted, .muted { fill: #A4A4AC !important; }
            .highlight, .highlight *, h2, .field b { fill: #D4A574 !important; color: #D4A574 !important; }
            rect[fill="#28a745"], rect[fill="#196c2e"] { fill: #D4A574 !important; }
            .languages .progress rect:not(:first-child) { fill: #D4A574 !important; }
            line, path[stroke="#cfd3d7"] { stroke: rgba(245, 244, 238, 0.12) !important; }
