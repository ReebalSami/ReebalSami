name: Metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/inject-webslinger.mjs
      - scripts/webslinger-character.mjs

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ----- LIGHT VARIANT -----------------------------------------------
      # Renders the isocalendar plugin (3D iso contribution grid) only.
      # Native CSS keyframes inside the plugin output animate the towers
      # rising on every page load. We post-process to inject the chibi
      # web-slinger character that swings across the year.
      - name: Render light isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-light.svg
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          config_padding: 0, 0
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # No extras_css here — the post-processor injects brand-color
          # overrides as a separate <style> block alongside the webslinger.

      - name: Inject web-slinger (light)
        run: node scripts/inject-webslinger.mjs assets/metrics-light.svg light

      # ----- DARK VARIANT ------------------------------------------------
      - name: Render dark isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-dark.svg
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          config_padding: 0, 0
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Inject web-slinger (dark)
        run: node scripts/inject-webslinger.mjs assets/metrics-dark.svg dark

      # ----- COMMIT BOTH -------------------------------------------------
      # lowlighter/metrics commits each SVG immediately, but our injection
      # runs AFTER its commit, so we need a second commit for the post-
      # processed result. Skip if no changes (e.g. weekend with no commits).
      - name: Commit post-processed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-light.svg assets/metrics-dark.svg
          if git diff --staged --quiet; then
            echo "No changes after webslinger injection."
          else
            git commit -m "chore(metrics): inject web-slinger into iso calendars"
            git push
          fi
