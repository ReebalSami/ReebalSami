name: Metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/inject-webslinger.mjs
      - scripts/webslinger-character.mjs

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ----- LIGHT VARIANT -----------------------------------------------
      # lowlighter/metrics auto-commits AND pushes its raw SVG (default
      # output_action: commit). The inject step then modifies the file and
      # the final commit step pushes the post-processed result. Because
      # multiple commits happen in the same run, the final push needs to
      # rebase onto whatever lowlighter just pushed.
      - name: Render light isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-light.svg
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          config_padding: 0, 0
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Inject web-slinger (light)
        run: node scripts/inject-webslinger.mjs assets/metrics-light.svg light

      # ----- DARK VARIANT ------------------------------------------------
      - name: Render dark isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReebalSami
          filename: assets/metrics-dark.svg
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          config_padding: 0, 0
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Inject web-slinger (dark)
        run: node scripts/inject-webslinger.mjs assets/metrics-dark.svg dark

      # ----- COMMIT BOTH -------------------------------------------------
      # lowlighter has already auto-committed AND pushed its raw SVGs to
      # origin/main. Our working tree now has the post-processed versions.
      # We:
      #   1. Fetch origin/main (latest, includes lowlighter's commits)
      #   2. Soft-reset HEAD to origin/main (keeps our working tree intact)
      #   3. Commit the (now-modified-vs-origin) SVGs on top
      #   4. Push (fast-forward, no conflicts possible)
      - name: Commit metrics with web-slinger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add assets/metrics-light.svg assets/metrics-dark.svg
          if git diff --staged --quiet; then
            echo "No changes — calendars unchanged since last run."
          else
            git commit -m "chore(metrics): inject web-slinger into iso calendars"
            git push origin main
          fi
