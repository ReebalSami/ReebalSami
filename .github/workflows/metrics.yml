name: Metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/build-calendar.mjs
      - scripts/lib/**
      - scripts/test-build.mjs
      - package.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Smoke test
        run: node scripts/test-build.mjs

      - name: Build calendar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/build-calendar.mjs --user ReebalSami --weeks 26 --out assets/metrics.svg

      - name: Commit + push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg
          if git diff --staged --quiet; then
            echo "No changes — calendar unchanged since last run."
          else
            git commit -m "chore(metrics): refresh iso calendar"
            git push origin main
          fi
