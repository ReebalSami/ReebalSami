name: Milestones

on:
  schedule:
    - cron: "23 */6 * * *" # every 6h at HH:23 UTC (00:23, 06:23, 12:23, 18:23)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/milestones.yml
      - scripts/generate-milestones.mjs
      - package.json

permissions:
  contents: write

jobs:
  milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Generate milestone SVGs
        # METRICS_TOKEN is a PAT. For the projects-v2 half of the card to
        # render, the PAT must ALSO have `read:project` scope alongside
        # `read:user`. Without project scope, the script gracefully
        # degrades — renders only the repo-milestones half with a warning
        # in the log, rather than failing the whole job.
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-milestones.mjs

      - name: Commit if changed
        # Rebase-retry on push: if another scheduled or push-triggered
        # workflow (e.g. github-numbers, metrics) raced us to main, the
        # initial `git push` returns "rejected (fetch first)". We
        # rebase our single commit onto the new HEAD and push again.
        # Three attempts cover the realistic max contention (3 parallel
        # workflows on the same path event); beyond that we'd rather
        # the job fail loudly than spin indefinitely.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain assets/milestones-light.svg assets/milestones-dark.svg)" ]]; then
            echo "No milestone changes — skipping commit."
            exit 0
          fi
          git add assets/milestones-light.svg assets/milestones-dark.svg
          git commit -m "chore(milestones): refresh SVGs"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing on origin/main and retrying."
            git pull --rebase origin main
            sleep 2
          done
          echo "::error::Push still failing after 3 rebase-retries."
          exit 1
