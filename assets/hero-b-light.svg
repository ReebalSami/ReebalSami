<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Hi, I'm Reebal — Data Scientist and AI Engineer based in Hamburg">
  <defs>
    <linearGradient id="bLightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#B6803F" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#B6803F" stop-opacity="0.22"/>
      <stop offset="75%"  stop-color="#B6803F" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B6803F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bLightHotspot" cx="50%" cy="0%" r="22%">
      <stop offset="0%"   stop-color="#E2C194" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E2C194" stop-opacity="0"/>
    </radialGradient>
    <filter id="bLightConeBlur" x="-25%" y="-10%" width="150%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .display { font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 600; letter-spacing: -0.02em; }
      .subhead { font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 400; letter-spacing: -0.005em; }
      .micro   { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-style: italic; letter-spacing: 0.04em; }
    </style>
  </defs>
  <rect width="800" height="240" fill="#FAF9F4"/>
  <!-- lamp cone, blurred for soft edges -->
  <g filter="url(#bLightConeBlur)">
    <path d="M 580 -20 L 460 240 L 700 240 Z" fill="url(#bLightCone)"/>
  </g>
  <!-- bright hotspot at the lamp source -->
  <ellipse cx="580" cy="0" rx="120" ry="40" fill="url(#bLightHotspot)"/>
  <!-- type, deliberately offset left so the cone breathes on the right -->
  <text class="display" x="60" y="124" fill="#22222A" font-size="38">Hi, I&#8217;m Reebal</text>
  <text class="subhead" x="60" y="160" fill="#7C7C82" font-size="19">Data Scientist &#38; AI Engineer &#183; Hamburg</text>
  <text class="micro" x="60" y="200" fill="#7C7C82" font-size="11">focused &#183; fully local &#183; on your terms</text>
</svg>
