<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="GitHub metrics — refreshing">
  <defs>
    <radialGradient id="phLightGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <style>
      .label { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; }
      .body  { font-family: "DM Sans", "Inter", ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
    </style>
  </defs>
  <rect width="800" height="320" fill="#1B1B20"/>
  <rect width="800" height="320" fill="url(#phLightGlow)"/>
  <text x="400" y="146" class="label" fill="#A4A4AC" text-anchor="middle">METRICS RENDERING</text>
  <rect x="370" y="156" width="60" height="1" fill="#D4A574" fill-opacity="0.55"/>
  <text x="400" y="186" class="body" fill="#F5F4EE" text-anchor="middle">First infographic publishes after the daily Action runs.</text>
  <text x="400" y="206" class="body" fill="#A4A4AC" text-anchor="middle">Trigger it manually from the Actions tab → Metrics → Run workflow.</text>
</svg>
