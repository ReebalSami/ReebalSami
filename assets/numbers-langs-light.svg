<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="Top languages for @ReebalSami by recent commits: TypeScript 54%, JavaScript 23%, Python 17%, Jupyter Notebook 6%.">
  <defs>
    <style>
      .section-label { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; font-weight: 500; }
      .row-label     { font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: -0.005em; }
      .row-value     { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .mid-value     { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .small-value   { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
      .row-desc      { font-family: "DM Sans", "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; }
    </style>
  </defs>
  <text x="24" y="14" class="section-label" fill="#7C7C82">TOP LANGUAGES · LAST 2 YEARS</text>
  <rect x="24" y="22" width="60" height="1" fill="#B6803F" fill-opacity="0.55"/>

  <text x="24" y="52" class="row-label" fill="#22222A">TypeScript</text>
  <rect x="156" y="46" width="246" height="6" fill="#22222A" fill-opacity="0.08" rx="3"/>
  <rect x="156" y="46" width="133" height="6" fill="#B6803F" rx="3"/>
  <text x="456" y="52" text-anchor="end" class="small-value" fill="#7C7C82">54%</text>
  <text x="24" y="80" class="row-label" fill="#22222A">JavaScript</text>
  <rect x="156" y="74" width="246" height="6" fill="#22222A" fill-opacity="0.08" rx="3"/>
  <rect x="156" y="74" width="57" height="6" fill="#B6803F" rx="3"/>
  <text x="456" y="80" text-anchor="end" class="small-value" fill="#7C7C82">23.3%</text>
  <text x="24" y="108" class="row-label" fill="#22222A">Python</text>
  <rect x="156" y="102" width="246" height="6" fill="#22222A" fill-opacity="0.08" rx="3"/>
  <rect x="156" y="102" width="41" height="6" fill="#B6803F" rx="3"/>
  <text x="456" y="108" text-anchor="end" class="small-value" fill="#7C7C82">16.8%</text>
